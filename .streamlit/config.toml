[theme]
base = "light"
primaryColor = "#167A7C"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18324D"
borderColor = "#E3EAF1"
baseRadius = "large"
buttonRadius = "medium"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
font = "sans-serif"
headingFont = "sans-serif"
chartCategoricalColors = ["#168B9A", "#E69A42", "#5267BD", "#B35F8E", "#59966A", "#A46D39"]

[theme.sidebar]
backgroundColor = "#EDF3F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18324D"
primaryColor = "#167A7C"
borderColor = "#DFE7EF"
